<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Auth Screen with Google Login Variant 2</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script
        id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { primary: "#FAC638", "background-light": "#f8f8f5", "background-dark": "#231e0f" }, fontFamily: { display: "Space Grotesk" }, borderRadius: { DEFAULT: "0.125rem", lg: "0.25rem", xl: "0.5rem", full: "0.75rem" } } } };</script>
    <style>
        .neo-shadow-black {
            box-shadow: 6px 6px 0 0 #000
        }

        .neo-shadow-blue {
            box-shadow: 6px 6px 0 0 #000
        }

        .neo-shadow-inset {
            box-shadow: inset 4px 4px 0 0 rgba(0, 0, 0, 0.2)
        }

        .grainy-overlay {
            position: absolute;
            inset: 0;
            background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuDUZ1K6kRs0xs46m6YbFvvL9cXvZBVmBvEw_ZKcNsws0lWdcBOQRmBsUb0BiwzNZK-7Rmt0vnU3TYd_yfmN9K2Nrtxzs8L2Q6-r56VSteXSMv1d3b_Cy4MZB-3ApA1Eaz0G7L_YLx177TMZ-QEmapj_Pffh9Gje6fWuO1v2H-YplxBlhnVKBnCRJS-ykuQNm0t3Sy5cPV6jFSwWhPdKAyer75oEI91dnCuNI0Xw4_VLAFK_9a6h7Jx6w1zydhi7LmccGkwL91UBPHQ);
            opacity: 0.2;
            pointer-events: none
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-black dark:text-white">
    <div class="min-h-screen flex flex-col md:flex-row">
        <!-- Left Side: High Contrast Image -->
        <div
            class="relative w-full md:w-5/12 lg:w-1/2 h-64 md:h-screen border-b-4 md:border-b-0 md:border-r-4 border-black overflow-hidden bg-black">
            <div class="absolute inset-0 bg-cover bg-center grayscale contrast-[1.5] brightness-75"
                data-alt="Grainy black and white perfume bottle close-up"
                style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBMdvwApHp3zBcymz7XT6oxbymkrSmImhI4gx9HzcYnEAu_xPQUXVUC-8nHfDStJb9efKpy_-I_VBu3yvqRvbQgo1CYIq_5gOdoQCoUYCHJIiN_9haWb-N_jLYkB4x7X-qZ94Mj4KUCECCYqHNaquj-78e92lQO5v2jyy8y9Kk3GHYRrx0Zew1st7_pHHcrP6S9MEqOD5ryTRjaDSumeuqb7E_-KU75w3kTNaCtmNLzSqllSxXt8Wq35R4foDwI7sg0jbtF4rULGmo');">
            </div>
            <div class="grainy-overlay"></div>
            <div class="absolute top-10 left-10 z-10">
                <div
                    class="flex items-center gap-2 bg-white text-black px-4 py-2 border-2 border-black neo-shadow-black">
                    <span class="material-symbols-outlined font-bold">flare</span>
                    <h1 class="text-xl font-black tracking-tighter uppercase">Essence</h1>
                </div>
            </div>
            <div class="absolute bottom-10 left-10 z-10 max-w-sm">
                <p
                    class="bg-primary text-white text-4xl font-black p-4 border-2 border-black neo-shadow-black uppercase italic">
                    Scents for the Bold
                </p>
            </div>
        </div>
        <!-- Right Side: Login Form -->
        <div
            class="w-full md:w-7/12 lg:w-1/2 flex items-center justify-center p-8 md:p-16 lg:p-24 bg-white dark:bg-zinc-900">
            <div class="w-full max-w-md flex flex-col gap-8">
                <header class="flex flex-col gap-2">
                    <h2 class="text-6xl font-black uppercase tracking-tighter text-black dark:text-white">
                        Enter<br />The Void
                    </h2>
                    <p class="text-lg font-medium border-l-4 border-primary pl-4 py-1 text-zinc-600 dark:text-zinc-400">
                        Login to access your exclusive perfume vault.
                    </p>
                </header>
                <div class="flex flex-col gap-6">
                    <!-- Google Login Button -->
                    <button
                        class="flex items-center justify-center gap-4 w-full h-16 bg-white text-black border-4 border-black neo-shadow-black hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-[4px_4px_0px_0px_#000000] transition-all">
                        <svg class="w-6 h-6" viewbox="0 0 24 24">
                            <path
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                fill="#4285F4"></path>
                            <path
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                fill="#34A853"></path>
                            <path
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                                fill="#FBBC05"></path>
                            <path
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                fill="#EA4335"></path>
                        </svg>
                        <span class="text-lg font-bold uppercase">Continue with Google</span>
                    </button>
                    <div class="relative flex items-center justify-center py-4">
                        <div class="absolute w-full border-t-2 border-black dark:border-white"></div>
                        <span class="relative bg-white dark:bg-zinc-900 px-4 text-xs font-black uppercase">Or use
                            email</span>
                    </div>
                    <form class="flex flex-col gap-5">
                        <div class="flex flex-col gap-1">
                            <label class="text-xs font-black uppercase">Email Address</label>
                            <input
                                class="w-full h-14 border-4 border-black dark:border-white bg-transparent p-4 font-bold focus:outline-none focus:bg-primary/10 transition-colors"
                                placeholder="YOUR@EMAIL.COM" type="email" />
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs font-black uppercase">Password</label>
                            <input
                                class="w-full h-14 border-4 border-black dark:border-white bg-transparent p-4 font-bold focus:outline-none focus:bg-primary/10 transition-colors"
                                placeholder="********" type="password" />
                        </div>
                        <div class="flex items-center justify-between py-2">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input
                                    class="w-6 h-6 border-4 border-black bg-white checked:bg-primary appearance-none rounded-none cursor-pointer"
                                    type="checkbox" />
                                <span class="text-xs font-bold uppercase">Remember me</span>
                            </label>
                            <a class="text-xs font-bold uppercase underline decoration-2 underline-offset-4 hover:text-primary transition-colors"
                                href="#">Forgot Password?</a>
                        </div>
                        <button
                            class="w-full h-16 bg-primary text-white border-4 border-black neo-shadow-blue hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-[4px_4px_0px_0px_#000000] transition-all"
                            type="submit">
                            <span class="text-xl font-black uppercase tracking-widest">Sign In</span>
                        </button>
                    </form>
                    <div class="mt-4 text-center">
                        <p class="text-sm font-medium">
                            Don't have an account?
                            <a class="font-black uppercase border-b-2 border-black dark:border-white pb-1 hover:bg-black hover:text-white transition-all px-1 ml-1"
                                href="#">Register Now</a>
                        </p>
                    </div>
                </div>
                <footer class="mt-auto pt-8 flex gap-6 opacity-60">
                    <a class="text-xs font-bold uppercase hover:underline" href="#">Privacy Policy</a>
                    <a class="text-xs font-bold uppercase hover:underline" href="#">Terms of Service</a>
                </footer>
            </div>
        </div>
    </div>
</body>

</html>
