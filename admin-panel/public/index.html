<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Initialize Scent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <h1 class="title">
          INITIALIZE
          <span>SCENT</span>
        </h1>
        <div class="title-rule"></div>
      </header>

      <form id="createForm" class="layout">
        <section class="left-col">
          <label class="upload-box" for="image">
            <input id="image" name="image" type="file" accept="image/*" required />
            <div class="upload-icon">⬆</div>
            <p class="upload-title">DRAG ESSENCE BLUEPRINT</p>
            <p class="upload-sub">RAW IMAGE OR DESIGN FILE (MAX 50MB)</p>
            <span class="tag">REQUIRED</span>
          </label>

          <aside class="compliance">
            <h3>⊙ COMPLIANCE CHECK</h3>
            <ul>
              <li>⊙ IFRA STANDARD VERIFIED</li>
              <li>⊙ SYNTHETIC COMPONENT LOG</li>
              <li>⊙ ECO-SOLVENT MATCH</li>
            </ul>
          </aside>
        </section>

        <section class="right-col">
          <div class="field">
            <label for="name">PRODUCT DESIGNATION</label>
            <input id="name" name="name" placeholder="E.G. CHROME OZONE V2" required />
          </div>

          <div class="field">
            <label for="price">MARKET VALUE (CREDITS)</label>
            <div class="money-wrap">
              <span>$</span>
              <input id="price" name="price" type="number" min="1" step="0.01" placeholder="0.00" required />
            </div>
          </div>

          <div class="field">
            <label for="description">OLFACTORY NARRATIVE</label>
            <textarea id="description" name="description" placeholder="DESCRIBE THE VISCERAL EXPERIENCE..." required></textarea>
          </div>

          <div class="submit-wrap">
            <button type="submit" class="submit-btn">
              <span>INITIALIZE SCENT</span>
              <span>⚡</span>
              <em>SYSTEM READY</em>
            </button>
            <p class="warning">WARNING: INITIALIZING WILL COMMIT MOLECULAR ID TO THE GLOBAL REGISTRY</p>
          </div>

          <p id="status" class="status"></p>
        </section>
      </form>
    </main>

    <script src="/main.js"></script>
  </body>
</html>
